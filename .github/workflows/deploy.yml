name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: './wedding-app/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./wedding-app
        
      - name: Build
        run: npm run build
        working-directory: ./wedding-app
        
      - name: Verify Build
        run: |
          if [ ! -f "./wedding-app/dist/index.html" ]; then
            echo "Build failed: index.html not found in dist/"
            exit 1
          fi
          ls -R ./wedding-app/dist/
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './wedding-app/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
